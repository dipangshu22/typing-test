<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blind typing test for Anurag!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EAEE; --surface:#F5F7F9; --ink:#1E2940; --muted:#66718A; --line:#C8CFDA;
  --accent:#B87D00; --accent-soft:#F3E3BC; --err:#B3362A; --err-soft:#F6DAD6;
  --ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131926; --surface:#1A2233; --ink:#DCE3F0; --muted:#8490A8; --line:#2D3852;
    --accent:#F0B43C; --accent-soft:#3A3120; --err:#F07A6A; --err-soft:#3D2323;
  }
}
:root[data-theme="dark"]{
  --bg:#131926; --surface:#1A2233; --ink:#DCE3F0; --muted:#8490A8; --line:#2D3852;
  --accent:#F0B43C; --accent-soft:#3A3120; --err:#F07A6A; --err-soft:#3D2323;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 64px}
h1{font-size:2rem;line-height:1.15;margin:0 0 4px;letter-spacing:-0.01em}
.lede{color:var(--muted);margin:0 0 28px}

.controls{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;margin-bottom:14px}
.group{display:flex;flex-direction:column;gap:6px}
.group > span{font-size:.85rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);flex-wrap:wrap}
.seg button{font:inherit;font-size:.95rem;border:0;background:transparent;color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:hover:not([aria-pressed="true"]){background:var(--accent-soft)}
select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:220px;max-width:100%}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.statusbar{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px;gap:12px}
.clock{font-family:var(--mono);font-size:2.4rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.clock.running{color:var(--accent)}
.hint{color:var(--muted);font-size:.9rem;text-align:right}
kbd{font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface)}

.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;cursor:text}
.viewport{position:relative;height:calc(1.9em * 3);overflow:hidden;font-family:var(--mono);font-size:1.35rem;line-height:1.9em;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){.viewport{scroll-behavior:auto}}
.word{display:inline-block}
.ch{white-space:pre;position:relative;color:var(--ink);transition:opacity .15s}
.ch.done{opacity:.22}
.ch.cur::before{content:"";position:absolute;left:-1px;top:.25em;bottom:.25em;width:2px;background:var(--accent);animation:blink 1s steps(1) infinite}
.stage.typing .ch.cur::before{animation:none}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.ch.cur::before{animation:none}}
.veil{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);font-size:1rem;color:var(--ink)}
.ghost{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;resize:none;font-size:16px;pointer-events:none}

.results{margin-top:28px}
.headline{display:flex;flex-wrap:wrap;gap:12px 48px;align-items:flex-end;padding-bottom:20px;border-bottom:1px solid var(--line)}
.big{display:flex;flex-direction:column}
.big b{font-family:var(--mono);font-size:4rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.big small{color:var(--muted);font-size:.95rem;margin-top:6px}
.minor{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 24px;margin:20px 0 8px}
.minor div{display:flex;flex-direction:column}
.minor span{color:var(--muted);font-size:.85rem}
.minor strong{font-family:var(--mono);font-weight:500;font-size:1.2rem}
.verdict{margin:14px 0 0;max-width:62ch}
h2{font-size:1.15rem;margin:32px 0 10px}
.review{font-family:var(--mono);font-size:1rem;line-height:1.9;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-height:220px;overflow:auto;word-break:break-word}
.review .bad{color:var(--err);background:var(--err-soft);border-radius:3px}
.mistakes{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.mistakes li{font-family:var(--mono);font-size:.92rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.mistakes .exp{color:var(--ink)}
.mistakes .got{color:var(--err)}
.none{color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{font:inherit;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--surface)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
@media (max-width:560px){
  .wrap{padding:28px 16px 48px}
  h1{font-size:1.6rem}
  .viewport{font-size:1.1rem}
  .big b{font-size:3rem}
  .stage{padding:16px}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function(){
const h = React.createElement;
const { useState, useEffect, useLayoutEffect, useRef, useCallback, useMemo } = React;

/* ---------- content ---------- */
const PARAGRAPHS = [
  { title: "Administrative reforms", text: "The government has repeatedly emphasised that administrative reforms are indispensable for the efficient functioning of public institutions. Bureaucratic procedures, if not periodically reviewed, tend to become cumbersome and counterproductive, thereby impeding the delivery of essential services. Consequently, several committees have recommended the simplification of paperwork, the digitisation of records, and the decentralisation of authority to ensure accountability at every level of governance." },
  { title: "Environmental degradation", text: "Environmental degradation has emerged as one of the most pressing challenges confronting humanity in the contemporary era. Indiscriminate deforestation, unchecked industrial effluents, and rampant urbanisation have collectively contributed to the depletion of natural resources. Unless remedial measures are implemented with utmost urgency, the ecological balance essential for sustaining life on this planet shall be irreversibly compromised." },
  { title: "Judicial pendency", text: "The judiciary in this country has long grappled with the perennial problem of pendency, wherein litigants are compelled to wait for years, sometimes decades, before their grievances are adjudicated. This inordinate delay not only erodes public confidence in the legal system but also perpetuates injustice, since the maxim justice delayed is justice denied remains distressingly applicable even today." },
  { title: "Financial inclusion", text: "Financial inclusion constitutes a cornerstone of inclusive economic growth, ensuring that marginalised and underprivileged sections of society gain access to formal banking channels. The proliferation of mobile banking and the introduction of zero-balance accounts have significantly reduced the dependency of rural populations on exploitative moneylenders, thereby fostering an environment conducive to entrepreneurship and financial self-sufficiency." },
  { title: "Renewable energy", text: "The transition towards renewable sources of energy is no longer a matter of choice but an existential imperative. Solar and wind installations, though initially capital-intensive, offer substantial long-term dividends by curtailing dependence on fossil fuels and mitigating the deleterious effects of carbon emissions on the atmosphere. Policymakers must therefore incentivise investment in clean technology through appropriate subsidies." },
  { title: "Bureaucratic accountability", text: "Accountability within the bureaucratic apparatus is fundamental to the preservation of democratic values. Civil servants, being custodians of public trust, are expected to discharge their duties with impartiality and transparency, free from extraneous political influence. The establishment of vigilance commissions and the enactment of whistleblower protection legislation are steps in the right direction, though implementation remains inconsistent." },
  { title: "Demographic dividend", text: "India stands at a unique juncture wherein its demographic dividend, characterised by a preponderance of working-age population, presents an unprecedented opportunity for accelerated economic growth. However, this potential can only be harnessed through substantial investment in education, vocational training, and healthcare infrastructure, failing which the dividend could degenerate into a demographic burden." },
  { title: "Cybersecurity threats", text: "The exponential proliferation of digital transactions has, paradoxically, rendered institutions increasingly vulnerable to cybersecurity threats. Sophisticated hacking attempts, phishing schemes, and ransomware attacks pose a formidable challenge to the integrity of sensitive data. Organisations are therefore compelled to invest substantially in robust encryption protocols and to cultivate awareness among employees regarding prudent digital practices." },
  { title: "Federal governance in India", text: "The framers of the Constitution envisaged a federal structure wherein powers are judiciously distributed between the Union and the constituent States, yet the Indian model exhibits pronounced unitary tendencies, particularly during periods of national emergency. Critics have long contended that the concentration of fiscal authority at the Centre, through instruments such as the Goods and Services Tax and centrally sponsored schemes, has progressively diminished the autonomy that States were originally guaranteed. Proponents, conversely, argue that a strong Centre is indispensable for maintaining uniformity in policy and for coordinating responses to challenges that transcend State boundaries, such as pandemics, natural calamities, and macroeconomic instability. The Finance Commission, constituted periodically under constitutional mandate, endeavours to reconcile these competing imperatives by recommending an equitable formula for the devolution of tax revenues. Nevertheless, disputes regarding horizontal and vertical devolution persist, with several southern States alleging that their fiscal prudence and demographic restraint are inadequately rewarded under the prevailing criteria. Resolving this tension necessitates sustained dialogue between the Union and the States, underpinned by mutual trust and a genuine commitment to cooperative federalism, rather than the adversarial posturing that frequently characterises contemporary political discourse.", long: true },
  { title: "The perils of unregulated urbanisation", text: "Unregulated urbanisation, precipitated by the relentless migration of rural populations in pursuit of livelihood, has engendered a plethora of civic and infrastructural challenges in metropolitan agglomerations across the subcontinent. Municipal authorities, constrained by inadequate resources and archaic planning frameworks, find themselves ill-equipped to accommodate the burgeoning demand for housing, sanitation, potable water, and reliable transportation. Consequently, unauthorised colonies proliferate on the peripheries of cities, frequently bereft of even rudimentary amenities, while existing infrastructure buckles under the strain of overuse. Traffic congestion, exacerbated by the proliferation of private vehicles and the paucity of efficient public transit, imposes substantial economic costs through lost productivity and elevated levels of atmospheric pollution. Furthermore, the encroachment upon wetlands and floodplains for construction purposes has rendered several cities acutely susceptible to flooding during the monsoon season, a phenomenon witnessed with alarming regularity in recent years. Addressing these multifaceted challenges necessitates a paradigm shift towards integrated urban planning, predicated upon the principles of sustainability, equitable resource distribution, and robust civic participation, lest our cities descend into a state of perpetual and irremediable crisis.", long: true },
  { title: "Artificial intelligence and the future of employment", text: "The advent of artificial intelligence and automation has precipitated considerable apprehension regarding the future trajectory of employment across virtually every sector of the global economy. Proponents of technological advancement contend that, historically, disruptive innovations have invariably generated novel categories of employment even as they rendered certain occupations obsolete, and that the current wave of automation shall prove no exception to this pattern. Sceptics, however, caution that the unprecedented pace and scale of contemporary technological change may preclude the smooth transition witnessed during previous industrial revolutions, particularly for workers engaged in routine, repetitive tasks susceptible to algorithmic replication. Sectors such as manufacturing, data entry, and customer service have already experienced significant displacement, with machine learning algorithms increasingly capable of performing tasks that were, until recently, considered the exclusive preserve of human cognition. Governments and educational institutions are consequently confronted with the imperative of substantially reforming curricula to emphasise skills that complement, rather than compete with, artificial intelligence, including critical thinking, creativity, and emotional intelligence. Absent such proactive intervention, the benefits of technological progress risk accruing disproportionately to a narrow stratum of society, thereby exacerbating existing inequalities and engendering considerable social and political instability.", long: true },
  { title: "Public health infrastructure and epidemic preparedness", text: "The recurrent emergence of infectious diseases, culminating most recently in a global pandemic of unprecedented severity, has starkly exposed the inadequacies pervading public health infrastructure in numerous developing nations. Chronic underinvestment in healthcare, manifesting as a paucity of hospital beds, an acute shortage of trained medical personnel, and inadequate diagnostic facilities, rendered several countries woefully unprepared to contend with a surge in critically ill patients. Furthermore, the fragmented nature of health governance, wherein responsibilities are diffused across multiple tiers of administration without coherent coordination, exacerbated the difficulties encountered in formulating and implementing a unified response strategy. Experts have consequently advocated for substantial and sustained augmentation of public health expenditure, coupled with the establishment of robust surveillance mechanisms capable of detecting and containing outbreaks at their nascent stages, before they metastasise into full-fledged epidemics. Equally imperative is the cultivation of international cooperation, since infectious pathogens recognise no political boundaries, and unilateral measures adopted by individual nations, however stringent, are ultimately insufficient absent a coordinated global response predicated upon the timely sharing of epidemiological data and scientific research.", long: true },
  { title: "Agricultural distress and the imperative of reform", text: "Agricultural distress continues to afflict a substantial proportion of the cultivating population, notwithstanding decades of policy interventions ostensibly designed to ameliorate the precarious economic circumstances confronting farmers. Fragmented landholdings, rendered increasingly unviable through successive generations of inheritance, preclude the realisation of economies of scale that larger, mechanised operations might otherwise achieve. Compounding this structural impediment is the persistent vulnerability of agricultural output to the vagaries of the monsoon, with erratic and insufficient rainfall periodically precipitating catastrophic crop failures. The minimum support price mechanism, while ostensibly intended to insulate farmers from precipitous fluctuations in market prices, suffers from inconsistent implementation and disproportionately benefits cultivators of a narrow range of crops, primarily wheat and rice, thereby distorting cropping patterns and exacerbating the depletion of groundwater resources in regions ill-suited to water-intensive cultivation. Comprehensive reform, encompassing the modernisation of agricultural markets, substantial investment in irrigation infrastructure, and the diversification of cropping patterns towards less water-intensive alternatives, is therefore indispensable if the chronic distress pervading the agrarian sector is to be meaningfully redressed, rather than perpetually deferred through piecemeal and ultimately inadequate measures.", long: true },
  { title: "The evolving discourse on data privacy", text: "The unprecedented proliferation of digital technologies has precipitated an urgent and increasingly contentious discourse concerning the protection of individual privacy in an era characterised by the ubiquitous collection, aggregation, and monetisation of personal data. Corporations, ostensibly offering services without direct monetary charge, routinely harvest vast quantities of behavioural information, subsequently leveraging sophisticated algorithms to construct remarkably detailed profiles of consumer preferences, which are then exploited for targeted advertising or, in more troubling instances, sold to third parties absent meaningful consent. Legislators across numerous jurisdictions have consequently endeavoured to formulate comprehensive regulatory frameworks intended to safeguard individual autonomy over personal information, though such efforts frequently encounter formidable resistance from powerful technology conglomerates wielding considerable lobbying influence. Moreover, the inherently transnational character of data flows complicates enforcement, since information collected within one jurisdiction may be processed and stored in another, subject to markedly divergent legal standards. Achieving an equitable equilibrium between fostering technological innovation and safeguarding fundamental privacy rights remains an unresolved and perpetually evolving challenge, necessitating continuous legislative refinement and vigilant judicial oversight." , long: true },
  { title: "Skill development and the paradox of unemployment", text: "A curious paradox pervades the contemporary labour market, wherein millions of ostensibly qualified graduates remain conspicuously unemployed even as employers persistently lament an acute shortage of adequately skilled personnel. This disquieting phenomenon is frequently attributed to a pronounced mismatch between the curricula disseminated within educational institutions and the practical competencies demanded by a rapidly evolving economy increasingly predicated upon technological proficiency. Vocational training, long relegated to a position of secondary importance within the prevailing educational hierarchy, is now belatedly recognised as an indispensable component of any comprehensive strategy aimed at addressing structural unemployment. Initiatives designed to bridge this chasm between academic instruction and industrial requirement must necessarily involve substantive collaboration between educational institutions and the private sector, ensuring that curricula remain responsive to emergent technologies and evolving market demands. Absent such concerted and sustained intervention, the demographic dividend, frequently invoked as a source of considerable optimism regarding future economic prospects, risks devolving into a demographic liability, characterised by widespread disillusionment among an increasingly restive and underemployed youth population.", long: true }
];

const COMMON = ("notwithstanding consequently jurisdiction infrastructure bureaucratic accountability implementation legislation expenditure decentralisation proliferation deterioration adjudication ameliorate rehabilitation institutional constitutional autonomous mechanism substantial predominantly overwhelmingly discretionary indispensable inadvertently subsequently circumstances irrespective transparency governance stakeholders comprehensive surveillance discrepancy negligence contravention pursuant thereby whereby notification amendment provisions stipulated ordinance tribunal magistrate litigation prosecution jurisdictional statutory regulatory compliance requisite feasibility viability sustainability equitable disproportionate exacerbate perpetuate ostensibly deliberate contemplated hitherto aforementioned undertaking obligation entitlement expeditious meticulous unprecedented conducive detrimental beneficial escalating diminishing formidable pervasive endemic chronic acute rampant unabated relentless perennial ubiquitous exponential aggregate cumulative empirical qualitative quantitative analogous heterogeneous homogeneous paradigm phenomenon anomaly discrepancy correlation causation methodology inference deduction premise assertion contention proposition refutation vindication endorsement corroborate substantiate elucidate delineate encompass constitute epitomise exemplify facilitate expedite curtail mitigate alleviate augment supplement corroborate reiterate stipulate necessitate warrant justify").split(" ");

const HOME = "as ask add all ash dad fad gas had has lad lag sad hall fall gall lass flask flash glass salad alas shall dash gash lash half jag hag sag slag slash hash sash skald".split(" ");
const TOP = "we were wet quiet quit quote rope ripe route tire tower power poet pour prey pretty type typo your you yet toy trip writer put pure pew wiper outer tier query rote pier".split(" ");
const DRILLS = "fjf jfj dkd kdk sls lsl a;a ;a; ghg hgh fjdk skal ruru eiei wowo qpqp tyty vmvm bnbn cxcx fj dk sl a; gh ty vn".split(" ");
const PUNCT_WORDS = "yes no well wait really okay today maybe however first then also still after before here there because although".split(" ");

function pick(list, prev){ let w; do { w = list[Math.floor(Math.random()*list.length)]; } while (list.length > 1 && w === prev); return w; }
function fromList(list, n){ const out=[]; let prev=null; for(let i=0;i<n;i++){ prev = pick(list, prev); out.push(prev);} return out.join(" "); }
function rint(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

const CONTRACTIONS = "don't can't it's I'm we're they'll won't isn't you've she'd let's that's".split(" ");

// Drill with every common mark: , . ? ! ; : ( ) [ ] " ' - / ... & @ # %
function punctuationMix(n) {
  const marks = [
    w => w + ",", w => w + ".", w => w + "?", w => w + "!", w => w + ";", w => w + ":",
    w => "(" + w + ")", w => "[" + w + "]", w => '"' + w + '"', w => "'" + w + "'",
    w => w + "'s", w => pick(CONTRACTIONS), w => w + "-" + pick(COMMON), w => w + "/" + pick(COMMON),
    w => w + "...", w => w + " &", w => "@" + w, w => "#" + w, w => rint(1, 99) + "%", w => w + " -"
  ];
  const out = [];
  let prev = null;
  for (let i = 0; i < n; i++) {
    prev = pick(i % 2 ? PUNCT_WORDS : COMMON, prev);
    out.push(marks[Math.floor(Math.random() * marks.length)](prev));
  }
  return out.join(" ");
}

// Turn a plain word list into sentences: capitals, commas, quotes, hyphens, end marks
function addPunctuation(str) {
  const words = str.split(" ");
  const out = [];
  let left = rint(5, 12);
  let start = true;
  for (let i = 0; i < words.length; i++) {
    let w = words[i];
    if (start) { w = w[0].toUpperCase() + w.slice(1); start = false; }
    left--;
    if (left <= 0 || i === words.length - 1) {
      const r = Math.random();
      w += r < 0.7 ? "." : r < 0.85 ? "?" : "!";
      left = rint(5, 12);
      start = true;
    } else {
      const r = Math.random();
      if (r < 0.12) w += ",";
      else if (r < 0.15) w += ";";
      else if (r < 0.17) w += ":";
      else if (r < 0.20) w = '"' + w + '"';
      else if (r < 0.22) w = "(" + w + ")";
      else if (r < 0.25 && i + 2 < words.length) { w = w + "-" + words[++i]; left--; }
      else if (r < 0.27) w += "'s";
    }
    out.push(w);
  }
  return out.join(" ");
}

// Plain version of a paragraph: lowercase, no punctuation
function stripPunctuation(text) {
  return text.replace(/[-\u2013\u2014\/]/g, " ").replace(/[^A-Za-z0-9\s]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
}

const PATTERNS = {
  common:  { label: "Common words",        gen: n => fromList(COMMON, n), punctuable: true },
  home:    { label: "Home row words",       gen: n => fromList(HOME, n), punctuable: true },
  top:     { label: "Top row words",        gen: n => fromList(TOP, n), punctuable: true },
  drills:  { label: "Finger drills",        gen: n => fromList(DRILLS, n) },
  numbers: { label: "Numbers",              gen: n => { const o=[]; for(let i=0;i<n;i++){ const k=rint(0,5);
      o.push(k===0 ? String(rint(1,99)) : k===1 ? String(rint(100,9999)) : k===2 ? rint(1,99)+"."+rint(0,9) : k===3 ? rint(1,12)+":"+String(rint(0,59)).padStart(2,"0") : k===4 ? rint(1,99)+","+String(rint(0,999)).padStart(3,"0") : String(rint(1990,2030))); } return o.join(" "); } },
  punct:   { label: "Punctuation drill",    gen: punctuationMix },
  capitals:{ label: "Capital letters",      gen: n => fromList(COMMON, n).split(" ").map((w,i)=> i%2===0 ? w[0].toUpperCase()+w.slice(1) : w).join(" "), punctuable: true }
};

const TIMES = [15, 30, 60, 120, 180, 240, 300];

/* ---------- app ---------- */
function App(){
  const [mode, setMode] = useState("paragraph");       // paragraph | words
  const [paraChoice, setParaChoice] = useState("random");
  const [pattern, setPattern] = useState("common");
  const [duration, setDuration] = useState(60);
  const [punct, setPunct] = useState(true);

  const [text, setText] = useState("");
  const [typed, setTyped] = useState("");
  const [status, setStatus] = useState("idle");        // idle | running | done
  const [startAt, setStartAt] = useState(0);
  const [now, setNow] = useState(0);
  const [focused, setFocused] = useState(false);
  const nextParaRef = useRef(0);
  const poolRef = useRef(PARAGRAPHS);

  const inputRef = useRef(null);
  const viewRef = useRef(null);
  const cursorRef = useRef(null);

  const shapeParagraph = useCallback(t => punct ? t : stripPunctuation(t), [punct]);
  const shapeWords = useCallback(t => (punct && PATTERNS[pattern].punctuable) ? addPunctuation(t) : t, [punct, pattern]);

  const makeInitial = useCallback(() => {
    if (mode === "paragraph") {
      const pool = paraChoice === "random-long" ? PARAGRAPHS.filter(p => p.long) : paraChoice === "random-short" ? PARAGRAPHS.filter(p => !p.long) : PARAGRAPHS;
      poolRef.current = pool;
      const start = paraChoice.startsWith("random") ? Math.floor(Math.random()*pool.length) : Number(paraChoice);
      nextParaRef.current = start + 1;
      return shapeParagraph(pool[start].text);
    }
    return shapeWords(PATTERNS[pattern].gen(90));
  }, [mode, paraChoice, pattern, shapeParagraph, shapeWords]);

  const makeMore = useCallback(() => {
    if (mode === "paragraph") {
      const pool = poolRef.current;
      const p = pool[nextParaRef.current % pool.length];
      nextParaRef.current += 1;
      return shapeParagraph(p.text);
    }
    return shapeWords(PATTERNS[pattern].gen(40));
  }, [mode, pattern, shapeParagraph, shapeWords]);

  const reset = useCallback((keepText) => {
    if (!keepText) setText(makeInitial());
    setTyped("");
    setStatus("idle");
    setStartAt(0); setNow(0);
    if (viewRef.current) viewRef.current.scrollTop = 0;
    setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
  }, [makeInitial]);

  // new text whenever the setup changes
  useEffect(() => { reset(false); }, [mode, paraChoice, pattern, duration, punct]); // eslint-disable-line

  // keep text ahead of the typist
  useEffect(() => {
    if (text && typed.length > text.length - 160) setText(t => t + " " + makeMore());
  }, [typed.length, text, makeMore]);

  // timer
  useEffect(() => {
    if (status !== "running") return;
    const id = setInterval(() => {
      const t = Date.now();
      setNow(t);
      if ((t - startAt) / 1000 >= duration) {
        setStatus("done");
        if (inputRef.current) inputRef.current.blur();
      }
    }, 100);
    return () => clearInterval(id);
  }, [status, startAt, duration]);

  // keep the cursor on the second visible line
  useLayoutEffect(() => {
    const c = cursorRef.current, v = viewRef.current;
    if (!c || !v) return;
    const lineH = c.offsetHeight || 30;
    v.scrollTop = Math.max(0, c.offsetTop - lineH);
  }, [typed.length, text]);

  // Tab / Esc to restart from anywhere
  useEffect(() => {
    const onKey = e => {
      if (e.key === "Tab" && !e.shiftKey && (document.activeElement === inputRef.current || status === "done")) { e.preventDefault(); reset(false); }
      else if (e.key === "Escape") { e.preventDefault(); reset(true); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [reset, status]);

  const BLOCKED = ["Backspace","Delete","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End","PageUp","PageDown"];
  function onKeyDown(e){
    if (BLOCKED.includes(e.key)) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && ["z","y","x","a"].includes(e.key.toLowerCase())) e.preventDefault();
  }
  useEffect(() => {
    const el = inputRef.current; if (!el) return;
    const f = e => { if (e.inputType && (e.inputType.startsWith("delete") || e.inputType.startsWith("history"))) e.preventDefault(); };
    el.addEventListener("beforeinput", f);
    return () => el.removeEventListener("beforeinput", f);
  }, []);
  function pinCaret(e){
    const n = e.target.value.length;
    if (e.target.selectionStart !== n || e.target.selectionEnd !== n) e.target.setSelectionRange(n, n);
  }

  function onInput(e){
    if (status === "done") return;
    const v = e.target.value.replace(/[\r\n]/g, "");
    if (v.length <= typed.length || !v.startsWith(typed)) { e.target.value = typed; return; }
    if (status === "idle" && v.length > 0) { const t = Date.now(); setStartAt(t); setNow(t); setStatus("running"); }
    setTyped(v);
  }

  const elapsed = status === "idle" ? 0 : Math.min(duration, (now - startAt) / 1000);
  const remaining = Math.max(0, duration - elapsed);

  // split target into words with global char offsets
  const words = useMemo(() => {
    const out = []; const re = /\S+\s*/g; let m;
    while ((m = re.exec(text))) out.push({ s: m[0], start: m.index });
    return out;
  }, [text]);

  const results = useMemo(() => {
    if (status !== "done") return null;
    const minutes = duration / 60;
    let correct = 0;
    for (let i = 0; i < typed.length; i++) if (typed[i] === text[i]) correct++;
    const mistakes = [];
    for (const w of words) {
      if (w.start >= typed.length) break;
      const word = w.s.trimEnd();
      const end = w.start + word.length;
      const got = typed.slice(w.start, Math.min(end, typed.length));
      const partial = end > typed.length;
      if (!partial && got !== word) mistakes.push({ exp: word, got });
    }
    return {
      wpm: Math.round((correct / 5) / minutes),
      raw: Math.round((typed.length / 5) / minutes),
      accuracy: typed.length ? Math.round(correct / typed.length * 1000) / 10 : 0,
      correct, total: typed.length, wrong: typed.length - correct,
      mistakes
    };
  }, [status, typed, text, words, duration]);

  /* ---------- render ---------- */
  const seg = (options, value, set) => h("div", { className: "seg", role: "group" },
    options.map(o => h("button", { key: o.value, type: "button", "aria-pressed": value === o.value, onClick: () => set(o.value) }, o.label)));

  const controls = h("div", { className: "controls" },
    h("div", { className: "group" }, h("span", null, "Text"),
      seg([{ value: "paragraph", label: "Paragraphs" }, { value: "words", label: "Word patterns" }], mode, setMode)),
    mode === "paragraph"
      ? h("label", { className: "group" }, h("span", null, "Paragraph"),
          h("select", { value: paraChoice, onChange: e => setParaChoice(e.target.value) },
            h("option", { value: "random" }, "Random (any length)"),
            h("option", { value: "random-short" }, "Random short"),
            h("option", { value: "random-long" }, "Random long"),
            h("optgroup", { label: "Short paragraphs" }, PARAGRAPHS.map((p, i) => !p.long && h("option", { key: i, value: String(i) }, p.title))),
            h("optgroup", { label: "Long paragraphs" }, PARAGRAPHS.map((p, i) => p.long && h("option", { key: i, value: String(i) }, p.title)))))
      : h("label", { className: "group" }, h("span", null, "Pattern"),
          h("select", { value: pattern, onChange: e => setPattern(e.target.value) },
            Object.entries(PATTERNS).map(([k, p]) => h("option", { key: k, value: k }, p.label)))),
    (mode === "paragraph" || PATTERNS[pattern].punctuable)
      ? h("div", { className: "group" }, h("span", null, "Punctuation"),
          seg([{ value: true, label: "On" }, { value: false, label: "Off" }], punct, setPunct))
      : null,
    h("div", { className: "group" }, h("span", null, "Time"),
      seg(TIMES.map(t => ({ value: t, label: t < 60 ? t + "s" : (t / 60) + " min" })), duration, setDuration))
  );

  const fmt = sec => { const s = Math.ceil(sec); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  const statusbar = h("div", { className: "statusbar" },
    h("div", { className: "clock" + (status === "running" ? " running" : ""), "aria-live": "off" }, fmt(remaining)),
    h("div", { className: "hint" },
      status === "idle" ? "The timer starts on your first key. Backspace is off. " : status === "running" ? "Keep going, you won't see your keys. " : "",
      h("kbd", null, "Tab"), " new text  ", h("kbd", null, "Esc"), " restart"));

  const stage = h("div", {
      className: "stage" + (status === "running" ? " typing" : ""),
      onClick: () => inputRef.current && inputRef.current.focus()
    },
    h("div", { className: "viewport", ref: viewRef, "aria-label": "Text to type" },
      words.map((w, wi) => h("span", { className: "word", key: wi },
        Array.from(w.s).map((ch, ci) => {
          const i = w.start + ci;
          const cls = i < typed.length ? "ch done" : i === typed.length ? "ch cur" : "ch";
          return h("span", { key: ci, className: cls, ref: i === typed.length ? cursorRef : null }, ch);
        })))),
    h("textarea", {
      ref: inputRef, className: "ghost", "aria-label": "Typing input (hidden)",
      autoComplete: "off", autoCorrect: "off", autoCapitalize: "off", spellCheck: false,
      value: typed, onChange: onInput, onKeyDown: onKeyDown, onSelect: pinCaret, onPaste: e => e.preventDefault(), onDrop: e => e.preventDefault(),
      onFocus: () => setFocused(true), onBlur: () => setFocused(false),
      disabled: status === "done"
    }),
    (!focused && status !== "done") ? h("div", { className: "veil" }, status === "running" ? "Paused focus. Click here to keep typing." : "Click here, then start typing") : null
  );

  let resultsView = null;
  if (results) {
    const verdict = results.total === 0
      ? "Nothing was typed this round. Click the text box and start typing to begin the next one."
      : results.accuracy >= 97 ? "Very clean. You're typing accurately without looking, so speed is the thing to push next."
      : results.accuracy >= 90 ? "Solid. A few slips crept in; slowing down slightly usually raises net speed when you can't see your mistakes."
      : "Lots of errors went unnoticed. Try a slower pace or a home row drill to build position memory.";
    resultsView = h("section", { className: "results", "aria-live": "polite" },
      h("div", { className: "headline" },
        h("div", { className: "big" }, h("b", null, results.wpm), h("small", null, "words per minute")),
        h("div", { className: "big" }, h("b", null, results.accuracy + "%"), h("small", null, "accuracy"))),
      h("div", { className: "minor" },
        h("div", null, h("span", null, "Raw speed"), h("strong", null, results.raw + " wpm")),
        h("div", null, h("span", null, "Correct characters"), h("strong", null, results.correct + " / " + results.total)),
        h("div", null, h("span", null, "Wrong characters"), h("strong", null, results.wrong)),
        h("div", null, h("span", null, "Time"), h("strong", null, fmt(duration)))),
      h("p", { className: "verdict" }, verdict),
      h("h2", null, "What you actually typed"),
      h("div", { className: "review" },
        results.total === 0 ? h("span", { className: "none" }, "Nothing typed.") :
        Array.from(typed).map((c, i) => c === text[i]
          ? h("span", { key: i }, c)
          : h("span", { key: i, className: "bad", title: "Expected " + JSON.stringify(text[i]) }, c === " " ? "␣" : c))),
      h("h2", null, "Words with mistakes"),
      results.mistakes.length === 0
        ? h("p", { className: "none" }, "No mistaken words.")
        : h("ul", { className: "mistakes" }, results.mistakes.slice(0, 30).map((m, i) =>
            h("li", { key: i }, h("span", { className: "exp" }, m.exp), "  ", h("span", { className: "got" }, m.got.replace(/ /g, "␣") || "(skipped)")))),
      h("div", { className: "actions" },
        h("button", { className: "btn", type: "button", onClick: () => reset(false) }, "New text"),
        h("button", { className: "btn alt", type: "button", onClick: () => reset(true) }, "Retry same text"))
    );
  }

  return h("main", { className: "wrap" },
    h("h1", null, "Blind typing test for Anurag!"),
    h("p", { className: "lede" }, "You see the text you need to type, never the keys you press. Your accuracy shows up only at the end."),
    controls, statusbar, stage, resultsView);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
